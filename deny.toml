# cargo-deny configuration for wire-codec.
#
# See https://embarkstudios.github.io/cargo-deny/ for the schema and behavior.
# Per REPS section "Dependency Management" this file enforces:
#   - license policy
#   - banned crates
#   - duplicate version detection
#   - source restrictions

[advisories]
# Run as part of `cargo deny check`. RustSec advisories that affect this crate's
# dependency tree fail the build.
yanked = "warn"
ignore = []

[licenses]
# Allowed licenses for the dependency tree with every feature enabled.
# wire-codec itself is `Apache-2.0 OR MIT`. Keep this list to licenses that
# are actually encountered, so a new one has to be reviewed explicitly.
allow = [
    "Apache-2.0",
    "MIT",
    # unicode-ident (proc-macro dependency of the optional async adapters).
    "Unicode-3.0",
    # memchr is dual "Unlicense OR MIT"; listed for completeness.
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Crates explicitly disallowed from the dependency tree. Empty by default.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
