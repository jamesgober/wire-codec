[package]
name = "wire-codec"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0 OR MIT"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Binary frame codec and protocol codec toolkit. Length-prefixed, delimiter-based, and custom framing strategies. Built-in varint, zigzag, bitfield, and packed struct encoding. Runtime-agnostic foundation under network-protocol crates."

keywords = [
    "codec",
    "framing",
    "varint",
    "wire",
    "rust"
]

categories = [
    "encoding",
    "network-programming"
]

documentation = "https://docs.rs/wire-codec"
repository    = "https://github.com/jamesgober/wire-codec"
homepage      = "https://github.com/jamesgober/wire-codec"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "wire_codec"
path = "src/lib.rs"

[features]
default = ["std"]
# Links the standard library. Also enables runtime CPU feature detection in
# the optional `memchr` dependency (AVX2 on x86_64).
std = ["memchr?/std", "bytes?/std"]
# Delegate delimiter search to the `memchr` crate (SIMD kernels, linear-time
# multi-byte search). Off by default: the built-in SWAR scan has no deps.
memchr = ["dep:memchr"]
# `codec::FrameCodec`: drive any `Framer` over a `bytes::BytesMut` buffer.
# Works without `std` (needs `alloc`).
bytes = ["dep:bytes"]
# `tokio_util::codec::{Decoder, Encoder}` for `codec::FrameCodec`.
tokio-util = ["bytes", "std", "dep:tokio-util"]
# `asynchronous_codec::{Decoder, Encoder}` for `codec::FrameCodec`
# (futures-io based runtimes: smol, async-std, embassy-net adapters).
asynchronous-codec = ["bytes", "std", "dep:asynchronous-codec"]

[dependencies]
# Optional, off by default. Justification (REPS Dependency Management):
# BurntSushi's memchr is the de-facto standard SIMD byte search, actively
# maintained, `no_std`, zero transitive dependencies, MSRV 1.61, and dual
# MIT/Unlicense. Used only by `framing::Delimited`.
memchr = { version = "2.7", optional = true, default-features = false }
# Optional integration adapters, off by default (REPS: integration adapters
# MUST be optional). `bytes` is the Tokio project's buffer crate: no_std,
# MSRV 1.57, MIT. `tokio-util` (MSRV 1.85, MIT) is used with only its `codec`
# feature. `asynchronous-codec` (MIT) is the maintained futures-io port of
# the same traits. Compatible ranges are used because all three follow
# semver strictly and are pulled in only on request.
bytes = { version = "1.5", optional = true, default-features = false }
tokio-util = { version = "0.7.10", optional = true, default-features = false, features = ["codec"] }
asynchronous-codec = { version = "0.7", optional = true }

[dev-dependencies]
# Property testing (REPS Testing). proptest 1.11 is the newest release whose
# declared rust-version (1.85) matches the crate MSRV; 1.12 requires 1.88.
# Edition 2024 enables the MSRV-aware resolver (resolver = "3"), so
# `cargo update` keeps selecting a 1.11.x release until the MSRV moves.
proptest = { version = "1.11", default-features = false, features = ["std"] }

[[bench]]
name = "codec"
harness = false
path = "benches/codec.rs"

[[bench]]
name = "framing"
harness = false
path = "benches/framing.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true