# REPS reproducibility requirement: the development toolchain is pinned to an
# exact release so every contributor and the default CI legs build with the
# same compiler. Bump it deliberately. The MSRV (`rust-version = "1.85"` in
# Cargo.toml) is enforced separately by the CI MSRV leg, which overrides this
# file through `RUSTUP_TOOLCHAIN`.
[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
